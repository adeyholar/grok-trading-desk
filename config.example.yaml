# grok-trading-desk — example configuration (equity / Options Paper Desk fork).
# Copy to config.yaml and fill in secrets. config.yaml is gitignored.
# Phase 0: crypto / pump.fun / Solana paths removed; Alpaca paper equities only.

mode: "paper"            # "paper" | "live". "live" additionally requires --i-understand-the-risk

grok:
  api_key: "xai-REPLACE_ME"
  base_url: "https://api.x.ai/v1/chat/completions"
  models:
    # grok-4-fast / grok-4 were retired 2026-05-15; both now redirect to
    # grok-4.3, which quietly made the "checker runs a stronger model" premise
    # false. See RESEARCH.md.
    fast: "grok-4.3"    # generator bots
    deep: "grok-4.6"    # adversarial stock checker
  reasoning_effort:
    # Only grok-4.3 accepts this parameter: none | low | medium | high.
    fast: "none"
  structured_outputs: true    # response_format json_schema, strict
  live_search: true           # without this the models answer from Feb 2026
  max_search_results: 15
  timeout_seconds: 30
  max_retries: 3

alpaca:
  # Prefer ALPACA_PAPER_API_KEY / ALPACA_PAPER_API_SECRET when set.
  api_key: "REPLACE_ME"
  api_secret: "REPLACE_ME"
  paper: true

risk:
  total_budget_usd: 2000.0
  daily_loss_limit_usd: 300.0
  max_open_total: 6
  max_open_stocks: 6
  max_per_sector: 2
  stock_max_pct: 1.0
  max_position_pct_of_market: 0.15   # <=15% of equity budget per trade
  max_position_pct_of_remaining_loss: 0.25  # <=25% of remaining daily loss room

stock_filter:
  # market_cap and sector have no Alpaca source; when the datum is missing the
  # filter is skipped rather than rejecting every candidate.
  min_price: 3.0
  max_price: 400.0
  min_avg_volume: 750000
  min_market_cap: 300000000
  max_market_cap: 50000000000
  min_rel_volume: 1.5
  min_gap_pct: 0.02
  max_gap_pct: 0.15
  excluded_sectors: []

scoring_weights:
  stocks:
    fundamentals: 0.25
    technicals: 0.25
    news_sentiment: 0.20
    insider: 0.15
    pulse: 0.15
    min_score_to_buy: 0.60

pulse:
  market_cache_minutes: 30
  min_go_signal: 0.30       # below this the equity book is paused

exits:
  interval_hours: 4
  take_profit_pct: 0.20
  stop_loss_pct: 0.08
  trim_fraction: 0.5

market_hours:
  timezone: "America/New_York"
  open: "09:35"
  close: "15:55"

# Bull/bear debate before the checker (TradingAgents, arXiv 2412.20138).
# Off by default: it doubles generator calls for a modest gain.
debate:
  enabled: false
  rounds: 1

# Past outcomes fed back into prompts (FinMem / TradingGPT / FinCon).
memory:
  enabled: true
  max_examples: 5
  lookback_days: 30

# Phase 1 — Options Paper Desk (Level 2 long call / long put only).
# Adeola Go is a product-side gate; Phase 1 code path is dry-run by default.
# Prefer env ALPACA_PAPER_API_KEY / ALPACA_PAPER_API_SECRET over alpaca.* below.
options:
  max_level: 2              # Level 2 only: buy call / buy put (no sell-to-open, no mleg)
  dte_min: 14               # ~2 weeks
  dte_max: 42               # ~6 weeks
  max_risk_usd: 250.0       # premium * 100 * qty ceiling per order
  max_per_underlying: 2     # up to one call + one put
  min_open_interest: 10
  min_overlay_score: 0.0
  dry_run: true             # log only; --submit-paper required for paper POST
  base_url: "https://paper-api.alpaca.markets"  # locked; non-paper refused

logging:
  path: "logs/desk.jsonl"
  echo_stdout: true
  cost_report_every: 25   # log a spend snapshot every N model calls
